name: unmuhbabelpress-staging

networks:
    staging:

volumes:
    mysql_data_staging:

services:
    mysql:
        image: mysql:8.4
        container_name: ubp-staging-mysql
        env_file:
            - .env.staging
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - '127.0.0.1:3307:3306' # local-only
        volumes:
            - mysql_data_staging:/var/lib/mysql
        networks: [staging]
        restart: unless-stopped
        healthcheck:
            test:
                [
                    'CMD',
                    'mysqladmin',
                    'ping',
                    '-h',
                    'localhost',
                    '--user=root',
                    '--password=${DB_ROOT_PASSWORD}',
                ]
            interval: 10s
            timeout: 3s
            retries: 10

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ubp-staging-app
        env_file:
            - .env.staging
        environment:
            NODE_ENV: production
        depends_on:
            mysql:
                condition: service_healthy
        # Bind to localhost only; Nginx will reverse-proxy
        ports:
            - '127.0.0.1:4000:3000'
        networks: [staging]
        restart: unless-stopped

    # Optional: phpMyAdmin (bound to localhost for security)
    phpmyadmin:
        image: phpmyadmin:5-apache
        container_name: ubp-staging-pma
        env_file:
            - .env.staging
        environment:
            PMA_HOST: mysql
            PMA_USER: ${PMA_USER:-root}
            PMA_PASSWORD: ${PMA_PASSWORD:-${DB_ROOT_PASSWORD}}
            PMA_ARBITRARY: 0
        ports:
            - '127.0.0.1:8081:80'
        depends_on:
            mysql:
                condition: service_healthy
        networks: [staging]
        restart: unless-stopped
