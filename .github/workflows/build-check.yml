name: Build Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # Ganti sesuai versi Node.js proyek kamu

      - name: Install Dependencies
        run: npm install

      - name: Run Build
        run: npm run build
